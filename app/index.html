<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Mirrors --color-paper in src/index.css — keep in sync (§9.1). -->
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#201c16" media="(prefers-color-scheme: dark)" />
    <title>TOTODILE</title>
    <!-- Stamps the resolved theme before first paint, so a dark reader never
         sees a flash of paper (§5.4). The key and the three values are the
         contract of src/lib/theme.ts — keep the two in sync. -->
    <script>
      try {
        const choice = localStorage.getItem("totodile.theme");
        const dark =
          choice === "dark" ||
          (choice !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
